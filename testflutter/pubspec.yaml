name: testflutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  http: ^1.2.2
  get_it: ^7.7.0
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  hydrated_bloc: ^9.1.5
  path_provider: ^2.1.0
  go_router: ^14.0.0
  sqflite: ^2.3.0               # Tuần 2 Ngày 5 — SQLite local database
  path: ^1.9.0                  # Tuần 2 Ngày 5 — xử lý đường dẫn file
  web_socket_channel: ^3.0.0    # Tuần 3 Ngày 2 — WebSocket client
  stomp_dart_client: ^2.1.2     # Tuần 3 Ngày 2 — STOMP over WebSocket
  flutter_riverpod: ^2.6.1      # Tuần 3 Ngày 3 — Riverpod (so sánh với Cubit)
  bloc_concurrency: ^0.2.5      # Tuần 3 Ngày 4 — Bloc Transformer (restartable/droppable)
  dio: ^5.8.0                   # Tuần 3 Ngày 8 — Dio HTTP client + AuthInterceptor
  image_picker: ^1.1.2           # Tuần 4 Ngày 3 — chọn ảnh từ gallery/camera
  file_picker: ^8.1.2            # Tuần 4 Ngày 3 — chọn tài liệu PDF/DOC/XLSX

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
